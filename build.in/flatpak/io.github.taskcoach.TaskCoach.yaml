app-id: io.github.taskcoach.TaskCoach
runtime: org.gnome.Platform

runtime-version: '50'
sdk: org.gnome.Sdk
command: taskcoach

finish-args:

  - --share=ipc
  - --socket=x11
  - --device=dri
  - --env=GDK_BACKEND=x11

  # Broad grant kept: dropping it for the file-chooser portal (wxPython 4.3.1
  # already shows the portal picker) is deferred with Flathub, see
  # docs/FLATPAK.md.
  - --filesystem=home

  - --talk-name=org.kde.StatusNotifierWatcher

  - --talk-name=org.gnome.Mutter.IdleMonitor

  # The start-up version check only (docs/PACKAGING.md, Version Check): a
  # bundle has no update channel. Mail stays local
  # (docs/EMAIL_ATTACHMENTS.md): no --talk-name=org.freedesktop.secrets.
  - --share=network

cleanup:
  - '*.a'
  - '*.la'
  - /include
  - /lib/pkgconfig
  - /share/man

modules:

  - name: glu
    buildsystem: meson
    sources:
      - type: archive
        url: https://archive.mesa3d.org/glu/glu-9.0.3.tar.xz
        sha256: bd43fe12f374b1192eb15fe20e45ff456b9bc26ab57f0eee919f96ca0f8a330f
    cleanup:
      - /include
      - /lib/pkgconfig
      - '*.a'

  - shared-modules/libappindicator/libappindicator-gtk3-introspection-12.10.json

  - python3-build-deps.json

  - name: python3-wxpython
    buildsystem: simple
    build-options:
      env:
        WXPYTHON_BUILD_ARGS: '--nodoc'
    build-commands:
      - pip3 install --no-build-isolation --prefix=${FLATPAK_DEST}
        --verbose wxpython-4.3.1.tar.gz
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/3d/dd/026f6286f8beefcdd9551ad2e05b4e3edb45e638cdc067db211c53c950ce/wxpython-4.3.1.tar.gz
        sha256: 4e3a95b63175be8e10f0662de506a36d8cc6cb86ecc5b30ae880c8dafb34a0cd

  # Without its dependencies: it requires wxPython, which pip would
  # otherwise build again from PyPI's latest over the one above. Its
  # other requirement, six, is never imported (docs/FLATPAK.md).
  - name: python3-squaremap
    buildsystem: simple
    build-commands:
      - pip3 install --no-deps --no-index --no-build-isolation
        --prefix=${FLATPAK_DEST} SquareMap-1.0.5.tar.gz
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/b6/51/732e520a3720a1e99a2d022965d9d09f0e3fe59b67c95ceca3e95e724216/SquareMap-1.0.5.tar.gz
        sha256: b16ce5950cbfa63e3284015095293cd26ed5e26045fd14d488fb825b4f95e9a8

  - python3-sources.json

  - name: taskcoach
    buildsystem: simple
    build-commands:
      - install -d /app/share/taskcoach
      - cp -r taskcoachlib /app/share/taskcoach/
      - cp taskcoach.py /app/share/taskcoach/

      - cp Welcome.tsk /app/share/taskcoach/

      - install -d /app/share/icons/hicolor
      - cp -a build.in/flatpak/icons/hicolor/. /app/share/icons/hicolor/
      - install -Dm644 build.in/flatpak/io.github.taskcoach.TaskCoach.desktop
        /app/share/applications/io.github.taskcoach.TaskCoach.desktop

      - install -Dm644 build.in/flatpak/io.github.taskcoach.TaskCoach.mime.xml
        /app/share/mime/packages/io.github.taskcoach.TaskCoach.xml
      - install -Dm644 build.in/flatpak/io.github.taskcoach.TaskCoach.metainfo.xml
        /app/share/metainfo/io.github.taskcoach.TaskCoach.metainfo.xml
      - |
        cat > /app/bin/taskcoach <<'LAUNCH'
        #!/bin/bash
        export PYTHONPATH="/app/share/taskcoach:${PYTHONPATH}"
        exec python3 /app/share/taskcoach/taskcoach.py "$@"
        LAUNCH
        chmod +x /app/bin/taskcoach
    sources:

      - type: dir
        path: ../..
