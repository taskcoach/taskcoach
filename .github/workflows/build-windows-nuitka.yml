name: Build Windows Package (Nuitka)

# Experimental: Nuitka-based Windows build
# This workflow tests Nuitka as an alternative to Python Embed + Inno Setup
# Nuitka compiles Python to C for faster startup and code protection

on:
  push:
    branches:
      - main
      - master
      - 'claude/**'
      - 'add-windows-build-action'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-nuitka:
    name: Build Windows ${{ matrix.arch }} (Nuitka)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # 64-bit build
          - arch: x64
            python_version: "3.11"
            suffix: "x64-nuitka"
          # 32-bit build
          - arch: x86
            python_version: "3.9"
            suffix: "x86-nuitka"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python_version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python_version }}
          architecture: ${{ matrix.arch }}

      - name: Get version info
        id: version
        shell: bash
        run: |
          VERSION=$(python -c "
          import sys
          sys.path.insert(0, '.')
          from taskcoachlib.meta import data
          print(data.version_full)
          ")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Install dependencies
        shell: pwsh
        run: |
          Write-Host "Installing wxPython..."
          python -m pip install --upgrade pip
          python -m pip install wxPython

          Write-Host "Installing TaskCoach dependencies..."
          python -m pip install `
            "six>=1.16.0" `
            pypubsub `
            "watchdog>=3.0.0" `
            "chardet>=5.2.0" `
            "python-dateutil>=2.9.0" `
            "pyparsing>=3.1.3" `
            lxml `
            keyring `
            numpy `
            "fasteners>=0.19" `
            "gntp>=1.0.3" `
            "squaremap>=1.0.5" `
            distro `
            WMI `
            pywin32

          Write-Host "All dependencies installed"

      - name: Test imports before Nuitka
        shell: pwsh
        run: |
          Write-Host "Testing Python installation..."
          python -c "import sys; print(f'Python {sys.version}')"

          Write-Host "Testing wxPython import..."
          python -c "import wx; print(f'wxPython {wx.version()}')"

          Write-Host "Testing taskcoachlib import..."
          python -c "import taskcoachlib; print('taskcoachlib imported successfully')"

          Write-Host "All imports successful!"

      - name: Build with Nuitka
        uses: Nuitka/Nuitka-Action@main
        with:
          nuitka-version: main
          script-name: taskcoach.py
          mode: app
          output-dir: nuitka-build
          output-file: TaskCoach
          include-package: taskcoachlib
          include-data-dir: icons.in=icons.in
          enable-plugins: anti-bloat
          windows-icon-from-ico: icons.in/taskcoach.ico
          windows-console-mode: disable

      - name: List Nuitka output
        shell: bash
        run: |
          echo "=== Nuitka build output ==="
          find nuitka-build -type f -name "*.exe" 2>/dev/null || echo "No exe found"
          ls -la nuitka-build/ || echo "No nuitka-build folder"
          if [ -d "nuitka-build/TaskCoach.dist" ]; then
            echo "=== dist folder contents ==="
            ls -la nuitka-build/TaskCoach.dist/ | head -30
          fi

      - name: Prepare for Inno Setup
        shell: pwsh
        run: |
          # Create build directory structure expected by Inno Setup
          New-Item -ItemType Directory -Force -Path "build\TaskCoach"

          # Copy Nuitka output to build folder
          if (Test-Path "nuitka-build\TaskCoach.dist") {
            Copy-Item -Path "nuitka-build\TaskCoach.dist\*" -Destination "build\TaskCoach\" -Recurse -Force
          } elseif (Test-Path "nuitka-build\TaskCoach.exe") {
            Copy-Item -Path "nuitka-build\TaskCoach.exe" -Destination "build\TaskCoach\" -Force
          }

          # Copy Welcome.tsk if it exists
          if (Test-Path "Welcome.tsk") {
            Copy-Item -Path "Welcome.tsk" -Destination "build\TaskCoach\"
          }

          # Copy icon for installer
          Copy-Item -Path "icons.in\taskcoach.ico" -Destination "build\TaskCoach\"

          Write-Host "Build folder contents:"
          Get-ChildItem "build\TaskCoach" | Select-Object -First 20

      - name: Create Inno Setup script
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $suffix = "${{ matrix.suffix }}"
          $arch = "${{ matrix.arch }}"

          $lines = [System.Collections.ArrayList]::new()
          [void]$lines.Add("; Task Coach Inno Setup Script ($suffix) - Nuitka build")
          [void]$lines.Add('#define MyAppName "Task Coach"')
          [void]$lines.Add("#define MyAppVersion `"$version`"")
          [void]$lines.Add('#define MyAppPublisher "Task Coach developers"')
          [void]$lines.Add('#define MyAppURL "https://github.com/taskcoach/taskcoach"')
          [void]$lines.Add('')
          [void]$lines.Add('[Setup]')
          [void]$lines.Add('AppId={{B9F6E6D5-8C3D-5E4F-A02B-7C9D3E5F6A7B}')
          [void]$lines.Add('AppName={#MyAppName}')
          [void]$lines.Add('AppVersion={#MyAppVersion}')
          [void]$lines.Add('AppVerName={#MyAppName} {#MyAppVersion}')
          [void]$lines.Add('AppPublisher={#MyAppPublisher}')
          [void]$lines.Add('AppPublisherURL={#MyAppURL}')
          [void]$lines.Add('AppSupportURL={#MyAppURL}/issues')
          [void]$lines.Add('AppUpdatesURL={#MyAppURL}/releases')
          [void]$lines.Add('DefaultDirName={autopf}\{#MyAppName}')
          [void]$lines.Add('DefaultGroupName={#MyAppName}')
          [void]$lines.Add('AllowNoIcons=yes')
          [void]$lines.Add('OutputDir=dist')
          [void]$lines.Add("OutputBaseFilename=TaskCoach-{#MyAppVersion}-windows-$suffix-setup")
          [void]$lines.Add('Compression=lzma2/ultra64')
          [void]$lines.Add('SolidCompression=yes')
          [void]$lines.Add('WizardStyle=modern')
          [void]$lines.Add('SetupIconFile=build\TaskCoach\taskcoach.ico')
          [void]$lines.Add('UninstallDisplayIcon={app}\taskcoach.ico')
          [void]$lines.Add('PrivilegesRequired=lowest')
          [void]$lines.Add('PrivilegesRequiredOverridesAllowed=dialog')
          [void]$lines.Add('MinVersion=6.1sp1')
          if ($arch -eq "x64") {
            [void]$lines.Add('ArchitecturesAllowed=x64')
            [void]$lines.Add('ArchitecturesInstallIn64BitMode=x64')
          }
          [void]$lines.Add('DisableProgramGroupPage=yes')
          [void]$lines.Add('LicenseFile=COPYRIGHT.txt')
          [void]$lines.Add('')
          [void]$lines.Add('[Languages]')
          [void]$lines.Add('Name: "english"; MessagesFile: "compiler:Default.isl"')
          [void]$lines.Add('')
          [void]$lines.Add('[Tasks]')
          [void]$lines.Add('Name: "desktopicon"; Description: "{cm:CreateDesktopIcon}"; GroupDescription: "{cm:AdditionalIcons}"; Flags: unchecked')
          [void]$lines.Add('')
          [void]$lines.Add('[Files]')
          [void]$lines.Add('Source: "build\TaskCoach\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs')
          [void]$lines.Add('')
          [void]$lines.Add('[Icons]')
          [void]$lines.Add('Name: "{group}\{#MyAppName}"; Filename: "{app}\TaskCoach.exe"; WorkingDir: "{app}"; IconFilename: "{app}\taskcoach.ico"')
          [void]$lines.Add('Name: "{group}\{cm:UninstallProgram,{#MyAppName}}"; Filename: "{uninstallexe}"')
          [void]$lines.Add('Name: "{autodesktop}\{#MyAppName}"; Filename: "{app}\TaskCoach.exe"; WorkingDir: "{app}"; IconFilename: "{app}\taskcoach.ico"; Tasks: desktopicon')
          [void]$lines.Add('')
          [void]$lines.Add('[Run]')
          [void]$lines.Add('Filename: "{app}\TaskCoach.exe"; WorkingDir: "{app}"; Description: "{cm:LaunchProgram,{#StringChange(MyAppName, ''&'', ''&&'')}}"; Flags: nowait postinstall skipifsilent')
          [void]$lines.Add('')
          [void]$lines.Add('[Registry]')
          [void]$lines.Add('Root: HKA; Subkey: "Software\Classes\.tsk"; ValueType: string; ValueName: ""; ValueData: "TaskCoach.TaskFile"; Flags: uninsdeletevalue')
          [void]$lines.Add('Root: HKA; Subkey: "Software\Classes\TaskCoach.TaskFile"; ValueType: string; ValueName: ""; ValueData: "Task Coach Task File"; Flags: uninsdeletekey')
          [void]$lines.Add('Root: HKA; Subkey: "Software\Classes\TaskCoach.TaskFile\DefaultIcon"; ValueType: string; ValueName: ""; ValueData: "{app}\taskcoach.ico,0"')
          [void]$lines.Add('Root: HKA; Subkey: "Software\Classes\TaskCoach.TaskFile\shell\open\command"; ValueType: string; ValueName: ""; ValueData: """{app}\TaskCoach.exe"" ""%1"""')

          $issContent = $lines -join "`r`n"
          Set-Content -Path "taskcoach-installer.iss" -Value $issContent -Encoding ASCII
          Write-Host "Inno Setup script created"

      - name: Build installer with Inno Setup
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /O+ "taskcoach-installer.iss"

      - name: List build artifacts
        shell: bash
        run: |
          echo "=== dist folder ==="
          ls -la dist/ || echo "No dist folder"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: TaskCoach-windows-${{ matrix.suffix }}-installer-${{ steps.version.outputs.version }}
          path: dist/TaskCoach-*.exe
          retention-days: 30

      - name: Create ZIP archive (portable version)
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SUFFIX="${{ matrix.suffix }}"
          cd build
          7z a -tzip "../TaskCoach-${VERSION}-windows-${SUFFIX}-portable.zip" TaskCoach/
          cd ..
          ls -la *.zip

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: TaskCoach-windows-${{ matrix.suffix }}-portable-${{ steps.version.outputs.version }}
          path: TaskCoach-*-portable.zip
          retention-days: 30
