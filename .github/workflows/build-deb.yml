name: Build Debian Package

on:
  push:
    branches:
      - master
    tags:
      # Release tags only: Major.Minor.Milestone.Patch (see meta/data.py).
      # '+' means one or more of the preceding class, so this excludes
      # stray tags such as v1.5.0-starofrainnight.
      - 'v[0-9]+.[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    # Defaults are opened/synchronize/reopened; ready_for_review is added
    # so leaving draft rebuilds rather than relying on the draft's runs.
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - master
  workflow_dispatch:

# Cancel superseded runs when a branch or PR is force-pushed; never
# cancel tag (release) builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write

jobs:
  build-deb:
    name: Build .deb on ${{ matrix.distro }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: debian:bookworm
            name: Debian Bookworm (12)
            codename: bookworm
            os: debian
            osver: "12"
          - distro: debian:trixie
            name: Debian Trixie (13)
            codename: trixie
            os: debian
            osver: "13"
          # DISABLED: Sid is rolling/unstable, not for end users. Uncomment if needed.
          # - distro: debian:sid
          #   name: Debian Sid (unstable)
          #   codename: sid
          #   os: debian
          #   osver: sid
          - distro: ubuntu:22.04
            name: Ubuntu 22.04 LTS (Jammy)
            codename: jammy
            os: ubuntu
            osver: "22.04"
          - distro: ubuntu:24.04
            name: Ubuntu 24.04 LTS (Noble)
            codename: noble
            os: ubuntu
            osver: "24.04"

    container:
      image: ${{ matrix.distro }}

    steps:
      - name: Install git and dependencies
        run: |
          apt-get update
          apt-get install -y git ca-certificates

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y \
            build-essential \
            debhelper \
            dh-python \
            python3-all \
            python3-setuptools \
            python3-distro \
            python3-pip \
            devscripts \
            lintian \
            fakeroot

      - name: Get version info and update debian/changelog
        id: version
        run: |
          # Extract version from meta/data.py
          VERSION=$(python3 -c "
          import sys
          sys.path.insert(0, '.')
          from taskcoachlib.meta import data
          print(data.version_full)
          ")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

          # Update debian/changelog with the correct version
          # This ensures the .deb package metadata matches the actual version
          CODENAME="${{ matrix.codename }}"
          DATE=$(date -R)
          echo "taskcoach (${VERSION}-1) ${CODENAME}; urgency=medium" > debian/changelog
          echo "" >> debian/changelog
          echo "  * Release ${VERSION}" >> debian/changelog
          echo "" >> debian/changelog
          echo " -- Réal Carbonneau <contact@realcarbonneau.com>  ${DATE}" >> debian/changelog
          echo "" >> debian/changelog
          echo "Updated debian/changelog:"
          cat debian/changelog

      - name: Bundle pip packages for distros with old versions
        run: |
          # ============================================================
          # Bookworm/Jammy Dependency Bundling
          # These distros have old versions of some packages:
          # - pyparsing: need >=3.1.3 (Bookworm has 3.0.9, Jammy has 3.0.7)
          # - watchdog: need >=3.0.0 (Bookworm has 2.2.1, Jammy has 2.1.6)
          # Bundle newer versions via pip, like Fedora does with squaremap.
          # ============================================================

          CODENAME="${{ matrix.codename }}"
          DESTDIR="debian/taskcoach/usr/lib/python3/dist-packages"

          case "$CODENAME" in
            bookworm|jammy)
              echo "Bundling pip packages for $CODENAME (old pyparsing/watchdog)..."
              mkdir -p "$DESTDIR"
              pip3 install --no-cache-dir --no-deps --target="$DESTDIR" \
                "pyparsing>=3.1.3" \
                "watchdog>=3.0.0"
              echo "Bundled packages:"
              ls -la "$DESTDIR"
              ;;
            *)
              echo "Distro $CODENAME has new enough packages, no bundling needed"
              ;;
          esac

      - name: Declare per-distro idle-detection bindings
        run: |
          # ============================================================
          # Optional bindings for the "Idle time notice" feature (off
          # by default; see docs/IDLE.md). Declared as Recommends here,
          # per distro, rather than as a blanket line in debian/control,
          # mirroring the pip-bundling step above.
          #
          #   python3-dbus       all targets - GNOME Mutter and KDE
          #                      Plasma 5 dbus idle backends
          #   python3-pywayland  only releases that ship a Plasma 6
          #                      desktop AND package it - the ext-idle-
          #                      notify-v1 backend. Add new Plasma 6
          #                      codenames to the first case arm.
          # ============================================================
          CODENAME="${{ matrix.codename }}"
          H='            hunspell-en-us | hunspell-dictionary'

          case "$CODENAME" in
            trixie)
              sed -i "s@^${H}\$@${H},\n            python3-dbus,\n            python3-pywayland@" debian/control
              echo "Recommends += python3-dbus, python3-pywayland ($CODENAME)"
              ;;
            bookworm|jammy|noble)
              sed -i "s@^${H}\$@${H},\n            python3-dbus@" debian/control
              echo "Recommends += python3-dbus ($CODENAME); python3-pywayland not packaged / not needed here (Plasma 5 / GNOME)"
              ;;
            *)
              echo "No idle-binding rule for $CODENAME; leaving debian/control unmodified"
              ;;
          esac
          echo "--- debian/control Recommends ---"
          grep -A4 '^Recommends:' debian/control

      - name: Build binary package
        run: |
          # Build binary package (unsigned)
          dpkg-buildpackage -us -uc -b
          echo "Binary package built"
          ls -la ../

      - name: Run lintian
        continue-on-error: true
        run: |
          echo "=== Running lintian on .changes file ==="
          lintian --info --display-info ../*.changes || true
          echo ""
          echo "=== Running lintian on .deb file ==="
          lintian --info --display-info ../*.deb || true

      - name: Collect build artifacts
        run: |
          mkdir -p artifacts
          VERSION="${{ steps.version.outputs.version }}"
          OS="${{ matrix.os }}"
          OSVER="${{ matrix.osver }}"
          CODENAME="${{ matrix.codename }}"

          # Copy and rename .deb file with descriptive name
          for deb in ../*.deb; do
            if [ -f "$deb" ]; then
              # Extract package name from original filename
              BASENAME=$(basename "$deb" .deb)
              PKGNAME=$(echo "$BASENAME" | cut -d_ -f1)
              # Create descriptive filename: taskcoach_1.6.1_debian-12-bookworm.deb
              NEWNAME="${PKGNAME}_${VERSION}_${OS}-${OSVER}-${CODENAME}.deb"
              cp "$deb" "artifacts/$NEWNAME"
              echo "Renamed: $deb -> $NEWNAME"
            fi
          done

          # Copy other build artifacts (binary build only, no source packages)
          cp ../*.changes artifacts/ 2>/dev/null || echo "No .changes files"
          cp ../*.buildinfo artifacts/ 2>/dev/null || echo "No .buildinfo files"
          ls -la artifacts/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: taskcoach-${{ steps.version.outputs.version }}-${{ matrix.os }}-${{ matrix.osver }}-${{ matrix.codename }}
          path: artifacts/
          retention-days: 30

  # Test installation on clean systems
  test-install:
    name: Test install on ${{ matrix.distro }}
    needs: build-deb
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: debian:bookworm
            os: debian
            osver: "12"
            codename: bookworm
          - distro: debian:trixie
            os: debian
            osver: "13"
            codename: trixie
          - distro: ubuntu:22.04
            os: ubuntu
            osver: "22.04"
            codename: jammy
          - distro: ubuntu:24.04
            os: ubuntu
            osver: "24.04"
            codename: noble

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          pattern: taskcoach-*-${{ matrix.os }}-${{ matrix.osver }}-${{ matrix.codename }}
          merge-multiple: true
          path: packages

      - name: Test installation in Docker
        run: |
          # Find the .deb file
          DEB_FILE=$(ls packages/*.deb 2>/dev/null | head -1)
          if [ -z "$DEB_FILE" ]; then
            echo "No .deb file found in packages/"
            ls -la packages/
            exit 1
          fi
          echo "Testing installation of: $DEB_FILE"

          # Run installation test in Docker
          docker run --rm \
            -e DEBIAN_FRONTEND=noninteractive \
            -e TZ=UTC \
            -v "$(pwd)/packages:/packages:ro" \
            ${{ matrix.distro }} \
            bash -c '
              set -e
              apt-get update

              # Install the package (this will fail on dependencies first)
              echo "Attempting package installation..."
              apt-get install -y /packages/*.deb 2>&1 || {
                echo "Installing dependencies..."
                apt-get install -f -y
              }

              # Verify installation
              echo "Verifying installation..."
              dpkg -l | grep taskcoach || {
                echo "Package not installed!"
                exit 1
              }

              # Check that key files exist
              echo "Checking installed files..."
              test -d /usr/lib/python3/dist-packages/taskcoachlib && echo "SUCCESS: taskcoachlib installed"
              test -f /usr/lib/python3/dist-packages/taskcoachlib/patches/hypertreelist.py && echo "SUCCESS: Bundled patch installed"

              # Test that Python can import the module
              echo "Testing Python import..."
              python3 -c "import taskcoachlib; print(taskcoachlib.__file__)" && echo "SUCCESS: taskcoachlib imports correctly"

              echo "All installation tests passed!"
            '

  # Create release with all packages
  release:
    name: Create Release
    needs: [build-deb, test-install]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: taskcoach-*
          merge-multiple: true
          path: packages

      - name: List packages
        run: ls -la packages/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: packages/*.deb
          draft: false
          prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
