name: Build Windows Package

on:
  push:
    branches:
      - main
      - master
      - 'claude/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel

          # Install wxPython (pre-built wheel available for Windows)
          pip install wxPython

          # Install all TaskCoach dependencies
          pip install `
            "six>=1.16.0" `
            pypubsub `
            "watchdog>=3.0.0" `
            "chardet>=5.2.0" `
            "python-dateutil>=2.9.0" `
            "pyparsing>=3.1.3" `
            lxml `
            keyring `
            numpy `
            "fasteners>=0.19" `
            "gntp>=1.0.3" `
            "squaremap>=1.0.5" `
            distro `
            WMI `
            pywin32

          # Install cx_Freeze for building executable
          pip install cx_Freeze

      - name: Get version info
        id: version
        shell: bash
        run: |
          VERSION=$(python -c "
          import sys
          sys.path.insert(0, '.')
          from taskcoachlib.meta import data
          print(data.version_full)
          ")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Create cx_Freeze setup script
        shell: bash
        run: |
          cat > setup_cxfreeze.py << 'ENDOFFILE'
          import sys
          from cx_Freeze import setup, Executable

          # Dependencies are automatically detected, but we need to
          # explicitly include some packages
          build_exe_options = {
              "packages": [
                  "wx",
                  "wx.adv",
                  "wx.html",
                  "wx.html2",
                  "wx.lib.agw",
                  "wx.lib.agw.customtreectrl",
                  "wx.lib.agw.hypertreelist",
                  "wx.grid",
                  "wx.stc",
                  "pubsub",
                  "watchdog",
                  "chardet",
                  "dateutil",
                  "pyparsing",
                  "lxml",
                  "keyring",
                  "numpy",
                  "fasteners",
                  "gntp",
                  "squaremap",
                  "wmi",
                  "win32api",
                  "win32com",
                  "pythoncom",
                  "taskcoachlib",
              ],
              "include_files": [
                  ("taskcoachlib", "lib/taskcoachlib"),
                  ("icons.in", "icons.in"),
              ],
              "excludes": ["tkinter", "test", "unittest"],
              "include_msvcr": True,
          }

          base = None
          if sys.platform == "win32":
              base = "Win32GUI"

          setup(
              name="TaskCoach",
              version="2.0.0",
              description="Your friendly task manager",
              options={"build_exe": build_exe_options},
              executables=[
                  Executable(
                      "taskcoach.py",
                      base=base,
                      target_name="TaskCoach.exe",
                      icon="icons.in/taskcoach.ico",
                  )
              ],
          )
          ENDOFFILE

      - name: Build with cx_Freeze
        timeout-minutes: 30
        run: |
          python setup_cxfreeze.py build
          echo "Build completed"
          Get-ChildItem -Path build -Recurse | Select-Object FullName

      - name: Test executable
        run: |
          # Find the build directory
          $buildDir = Get-ChildItem -Path build -Directory | Select-Object -First 1

          if (Test-Path "$($buildDir.FullName)\TaskCoach.exe") {
            Write-Host "SUCCESS: TaskCoach.exe created"
            $fileInfo = Get-Item "$($buildDir.FullName)\TaskCoach.exe"
            Write-Host "Size: $($fileInfo.Length / 1MB) MB"
          } else {
            Write-Host "ERROR: TaskCoach.exe not found"
            Get-ChildItem -Path build -Recurse
            exit 1
          }

      - name: Create ZIP archive
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Find the build directory (e.g., build/exe.win-amd64-3.11)
          BUILD_DIR=$(ls -d build/exe.* | head -1)
          # Rename to TaskCoach for cleaner zip structure
          mv "$BUILD_DIR" "build/TaskCoach"
          cd build
          7z a -tzip "../TaskCoach-${VERSION}-windows-x64.zip" TaskCoach/
          cd ..
          ls -la *.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TaskCoach-windows-${{ steps.version.outputs.version }}
          path: TaskCoach-*.zip
          retention-days: 30

  # Test the built executable
  test-windows:
    name: Test Windows Build
    needs: build-windows
    runs-on: windows-latest

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          pattern: TaskCoach-windows-*
          merge-multiple: true

      - name: Extract and test
        run: |
          # Find and extract the ZIP
          $zipFile = Get-ChildItem -Filter "TaskCoach-*.zip" | Select-Object -First 1
          Write-Host "Extracting: $($zipFile.Name)"
          Expand-Archive -Path $zipFile.FullName -DestinationPath "test-install"

          # Verify structure
          if (Test-Path "test-install\TaskCoach\TaskCoach.exe") {
            Write-Host "SUCCESS: Executable found in extracted archive"

            # Check file size is reasonable (should be > 10MB for a full app)
            $exeSize = (Get-Item "test-install\TaskCoach\TaskCoach.exe").Length / 1MB
            Write-Host "Executable size: $exeSize MB"

            if ($exeSize -lt 1) {
              Write-Host "WARNING: Executable seems too small"
            }
          } else {
            Write-Host "ERROR: Executable not found"
            Get-ChildItem -Path "test-install" -Recurse | Select-Object FullName
            exit 1
          }

          Write-Host "All tests passed!"

  # Create release with Windows package
  release:
    name: Create Release
    needs: [build-windows, test-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: TaskCoach-windows-*
          merge-multiple: true
          path: packages

      - name: List packages
        run: ls -la packages/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: packages/TaskCoach-*.zip
          draft: false
          prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
