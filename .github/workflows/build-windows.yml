name: Build Windows Package

on:
  push:
    branches:
      - main
      - master
      - 'claude/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version info
        id: version
        shell: bash
        run: |
          # Use system Python just for version extraction
          VERSION=$(python -c "
          import sys
          sys.path.insert(0, '.')
          from taskcoachlib.meta import data
          print(data.version_full)
          ")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Download Python embeddable package
        shell: pwsh
        run: |
          # Download Python 3.11 embeddable package (64-bit)
          $pythonVersion = "3.11.9"
          $pythonUrl = "https://www.python.org/ftp/python/$pythonVersion/python-$pythonVersion-embed-amd64.zip"

          Write-Host "Downloading Python $pythonVersion embeddable package..."
          Invoke-WebRequest -Uri $pythonUrl -OutFile "python-embed.zip"

          # Create build directory
          New-Item -ItemType Directory -Force -Path "build\TaskCoach"

          # Extract Python
          Expand-Archive -Path "python-embed.zip" -DestinationPath "build\TaskCoach\python" -Force

          Write-Host "Python embeddable package extracted"
          Get-ChildItem "build\TaskCoach\python"

      - name: Configure Python embeddable for pip
        shell: pwsh
        run: |
          # Enable site-packages by modifying python311._pth
          $pthFile = "build\TaskCoach\python\python311._pth"
          $content = Get-Content $pthFile
          # Uncomment import site
          $content = $content -replace '#import site', 'import site'
          # Add Lib\site-packages
          $content += "`nLib\site-packages"
          Set-Content $pthFile $content

          Write-Host "Modified python311._pth:"
          Get-Content $pthFile

          # Download and install pip
          Write-Host "Installing pip..."
          Invoke-WebRequest -Uri "https://bootstrap.pypa.io/get-pip.py" -OutFile "get-pip.py"
          & "build\TaskCoach\python\python.exe" get-pip.py --no-warn-script-location

          Write-Host "Pip installed successfully"

      - name: Install dependencies
        shell: pwsh
        run: |
          $pythonExe = "build\TaskCoach\python\python.exe"

          # Install wxPython (pre-built wheel)
          Write-Host "Installing wxPython..."
          & $pythonExe -m pip install wxPython --no-warn-script-location

          # Install all TaskCoach dependencies
          Write-Host "Installing TaskCoach dependencies..."
          & $pythonExe -m pip install `
            "six>=1.16.0" `
            pypubsub `
            "watchdog>=3.0.0" `
            "chardet>=5.2.0" `
            "python-dateutil>=2.9.0" `
            "pyparsing>=3.1.3" `
            lxml `
            keyring `
            numpy `
            "fasteners>=0.19" `
            "gntp>=1.0.3" `
            "squaremap>=1.0.5" `
            distro `
            WMI `
            pywin32 `
            --no-warn-script-location

          Write-Host "All dependencies installed"

      - name: Copy application files
        shell: pwsh
        run: |
          # Copy taskcoachlib
          Copy-Item -Path "taskcoachlib" -Destination "build\TaskCoach\taskcoachlib" -Recurse

          # Copy main script
          Copy-Item -Path "taskcoach.py" -Destination "build\TaskCoach\"

          # Copy icons
          Copy-Item -Path "icons.in" -Destination "build\TaskCoach\icons.in" -Recurse

          # Copy Welcome.tsk if it exists
          if (Test-Path "Welcome.tsk") {
            Copy-Item -Path "Welcome.tsk" -Destination "build\TaskCoach\"
          }

          # Copy icon for installer
          Copy-Item -Path "icons.in\taskcoach.ico" -Destination "build\TaskCoach\"

          Write-Host "Application files copied"
          Get-ChildItem "build\TaskCoach"

      - name: Create launcher executable
        shell: pwsh
        run: |
          # Create a simple batch launcher
          $launcherContent = @'
          @echo off
          cd /d "%~dp0"
          start "" "python\pythonw.exe" "taskcoach.py" %*
          '@
          Set-Content -Path "build\TaskCoach\TaskCoach.bat" -Value $launcherContent

          # Also create a VBS launcher for silent execution (no console window)
          $vbsContent = @'
          Set WshShell = CreateObject("WScript.Shell")
          WshShell.CurrentDirectory = CreateObject("Scripting.FileSystemObject").GetParentFolderName(WScript.ScriptFullName)
          WshShell.Run "python\pythonw.exe taskcoach.py", 0, False
          '@
          Set-Content -Path "build\TaskCoach\TaskCoach.vbs" -Value $vbsContent

          Write-Host "Launchers created"

      - name: Create launcher EXE using iexpress
        shell: pwsh
        run: |
          # Create a proper .exe launcher using iexpress (built into Windows)
          # First create the SED file for iexpress
          $sedContent = @"
          [Version]
          Class=IEXPRESS
          SEDVersion=3
          [Options]
          PackagePurpose=InstallApp
          ShowInstallProgramWindow=0
          HideExtractAnimation=1
          UseLongFileName=1
          InsideCompressed=0
          CAB_FixedSize=0
          CAB_ResvCodeSigning=0
          RebootMode=N
          InstallPrompt=
          DisplayLicense=
          FinishMessage=
          TargetName=build\TaskCoach\TaskCoach.exe
          FriendlyName=Task Coach
          AppLaunched=cmd /c start "" "%~dp0python\pythonw.exe" "%~dp0taskcoach.py"
          PostInstallCmd=<None>
          AdminQuietInstCmd=
          UserQuietInstCmd=
          SourceFiles=SourceFiles
          [Strings]
          [SourceFiles]
          SourceFiles0=build\TaskCoach\
          [SourceFiles0]
          TaskCoach.bat=
          "@

          # Actually, let's use a simpler approach - create a .cmd that gets converted
          # The batch approach works well for now

          Write-Host "Launcher configuration complete"

      - name: Test the build
        shell: pwsh
        run: |
          Write-Host "Testing Python installation..."
          & "build\TaskCoach\python\python.exe" -c "import sys; print(f'Python {sys.version}')"

          Write-Host "Testing wxPython import..."
          & "build\TaskCoach\python\python.exe" -c "import wx; print(f'wxPython {wx.version()}')"

          Write-Host "Testing taskcoachlib import..."
          $env:PYTHONPATH = "build\TaskCoach"
          & "build\TaskCoach\python\python.exe" -c "import taskcoachlib; print('taskcoachlib imported successfully')"

          Write-Host "All tests passed!"

      - name: Create Inno Setup script
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"

          $issContent = @"
          ; Task Coach Inno Setup Script
          #define MyAppName "Task Coach"
          #define MyAppVersion "$version"
          #define MyAppPublisher "Task Coach developers"
          #define MyAppURL "https://github.com/taskcoach/taskcoach"

          [Setup]
          AppId={{A8F5E5D4-7B2C-4D3E-9F1A-6B8C2D4E5F6A}
          AppName={#MyAppName}
          AppVersion={#MyAppVersion}
          AppVerName={#MyAppName} {#MyAppVersion}
          AppPublisher={#MyAppPublisher}
          AppPublisherURL={#MyAppURL}
          AppSupportURL={#MyAppURL}/issues
          AppUpdatesURL={#MyAppURL}/releases
          DefaultDirName={autopf}\{#MyAppName}
          DefaultGroupName={#MyAppName}
          AllowNoIcons=yes
          OutputDir=dist
          OutputBaseFilename=TaskCoach-{#MyAppVersion}-windows-x64-setup
          Compression=lzma2/ultra64
          SolidCompression=yes
          WizardStyle=modern
          SetupIconFile=build\TaskCoach\taskcoach.ico
          UninstallDisplayIcon={app}\taskcoach.ico
          PrivilegesRequired=lowest
          PrivilegesRequiredOverridesAllowed=dialog
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          DisableProgramGroupPage=yes
          LicenseFile=LICENSE.txt

          [Languages]
          Name: "english"; MessagesFile: "compiler:Default.isl"

          [Tasks]
          Name: "desktopicon"; Description: "{cm:CreateDesktopIcon}"; GroupDescription: "{cm:AdditionalIcons}"; Flags: unchecked

          [Files]
          Source: "build\TaskCoach\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{group}\{#MyAppName}"; Filename: "{app}\python\pythonw.exe"; Parameters: """{app}\taskcoach.py"""; WorkingDir: "{app}"; IconFilename: "{app}\taskcoach.ico"
          Name: "{group}\{cm:UninstallProgram,{#MyAppName}}"; Filename: "{uninstallexe}"
          Name: "{autodesktop}\{#MyAppName}"; Filename: "{app}\python\pythonw.exe"; Parameters: """{app}\taskcoach.py"""; WorkingDir: "{app}"; IconFilename: "{app}\taskcoach.ico"; Tasks: desktopicon

          [Run]
          Filename: "{app}\python\pythonw.exe"; Parameters: """{app}\taskcoach.py"""; WorkingDir: "{app}"; Description: "{cm:LaunchProgram,{#StringChange(MyAppName, '&', '&&')}}"; Flags: nowait postinstall skipifsilent

          [Registry]
          Root: HKA; Subkey: "Software\Classes\.tsk"; ValueType: string; ValueName: ""; ValueData: "TaskCoach.TaskFile"; Flags: uninsdeletevalue
          Root: HKA; Subkey: "Software\Classes\TaskCoach.TaskFile"; ValueType: string; ValueName: ""; ValueData: "Task Coach Task File"; Flags: uninsdeletekey
          Root: HKA; Subkey: "Software\Classes\TaskCoach.TaskFile\DefaultIcon"; ValueType: string; ValueName: ""; ValueData: "{app}\taskcoach.ico,0"
          Root: HKA; Subkey: "Software\Classes\TaskCoach.TaskFile\shell\open\command"; ValueType: string; ValueName: ""; ValueData: """{app}\python\pythonw.exe"" ""{app}\taskcoach.py"" ""%1"""
          "@

          Set-Content -Path "taskcoach-installer.iss" -Value $issContent
          Write-Host "Inno Setup script created"
          Get-Content "taskcoach-installer.iss"

      - name: Build installer with Inno Setup
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.4
        with:
          path: taskcoach-installer.iss
          options: /O+

      - name: List build artifacts
        shell: bash
        run: |
          echo "=== dist folder ==="
          ls -la dist/ || echo "No dist folder"
          echo "=== build folder ==="
          ls -la build/TaskCoach/ | head -20

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: TaskCoach-windows-installer-${{ steps.version.outputs.version }}
          path: dist/TaskCoach-*.exe
          retention-days: 30

      - name: Create ZIP archive (portable version)
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cd build
          7z a -tzip "../TaskCoach-${VERSION}-windows-x64-portable.zip" TaskCoach/
          cd ..
          ls -la *.zip

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: TaskCoach-windows-portable-${{ steps.version.outputs.version }}
          path: TaskCoach-*-portable.zip
          retention-days: 30

  # Create release with Windows packages
  release:
    name: Create Release
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: TaskCoach-windows-*
          merge-multiple: true
          path: packages

      - name: List packages
        run: ls -la packages/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            packages/TaskCoach-*.exe
            packages/TaskCoach-*.zip
          draft: false
          prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
